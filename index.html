<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JARVIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Decorative corner brackets -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Top header with JARVIS name -->
    <header>
        <h1>J.A.R.V.I.S</h1>
        <p id="clock">--:--</p>
    </header>

    <div id="layout">
        <!-- Left decorative panel -->
        <aside class="panel panel-left">
            <p class="panel-title">DIAGNOSTICS</p>
            <div class="stat-row"><span>CPU</span><div class="bar"><i id="barCpu"></i></div></div>
            <div class="stat-row"><span>MEM</span><div class="bar"><i id="barMem"></i></div></div>
            <div class="stat-row"><span>NET</span><div class="bar"><i id="barNet"></i></div></div>
            <p class="panel-title" style="margin-top:28px;">POWER CORE</p>
            <p class="readout" id="powerReadout">100%</p>

            <p class="panel-title" style="margin-top:28px;">UPTIME</p>
            <p class="readout readout-small" id="uptimeReadout">00:00:00</p>

            <p class="panel-title" style="margin-top:28px;">CORE TEMP</p>
            <p class="readout readout-small" id="tempReadout">36°C</p>
        </aside>

        <main>
            <!-- The glowing orb: an arc-reactor style HUD built from concentric rings -->
            <div id="orbWrap">
                <svg id="orb" viewBox="0 0 200 200">
                    <circle class="ring ring-outer" cx="100" cy="100" r="92" />
                    <circle class="ring ring-dashed" cx="100" cy="100" r="76" />
                    <circle class="ring ring-mid" cx="100" cy="100" r="60" />
                    <circle class="ring ring-ticks" cx="100" cy="100" r="46" />

                    <g class="rays">
                        <line x1="132" y1="100" x2="195" y2="100" />
                        <line x1="122.6" y1="122.6" x2="167.2" y2="167.2" />
                        <line x1="100" y1="132" x2="100" y2="195" />
                        <line x1="77.4" y1="122.6" x2="32.8" y2="167.2" />
                        <line x1="68" y1="100" x2="5" y2="100" />
                        <line x1="77.4" y1="77.4" x2="32.8" y2="32.8" />
                        <line x1="100" y1="68" x2="100" y2="5" />
                        <line x1="122.6" y1="77.4" x2="167.2" y2="32.8" />
                    </g>

                    <g class="particles">
                        <circle cx="160" cy="90" r="1.4" />
                        <circle cx="150" cy="140" r="1" />
                        <circle cx="120" cy="165" r="1.6" />
                        <circle cx="75" cy="168" r="1" />
                        <circle cx="40" cy="145" r="1.3" />
                        <circle cx="35" cy="95" r="1" />
                        <circle cx="55" cy="45" r="1.4" />
                        <circle cx="105" cy="30" r="1" />
                        <circle cx="150" cy="55" r="1.3" />
                        <circle cx="175" cy="120" r="1" />
                    </g>

                    <circle class="core" cx="100" cy="100" r="30" />
                </svg>
            </div>
            <p id="status">SYSTEM IDLE</p>

            <!-- Chat history will be added here by script.js -->
            <div id="chat"></div>

            <!-- Controls -->
            <div id="controls">
                <input type="text" id="textInput" placeholder="Type a command...">
                <button id="sendBtn">Send</button>
                <button id="micBtn">🎤 Speak</button>
            </div>
        </main>

    </div>

    <!-- script.js must load after the HTML above so it can find these elements -->
    <script src="script.js"></script>
</body>
</html>
